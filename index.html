<style>
:root{
  --bg:#0D0F12;--surface:#16191E;--raise:#1E2228;--raise2:#262B33;--line:#2A3038;--ink:#F1F3F6;--muted:#8A93A0;--dim:#5C6470;
  --accent:#3D8BFD;--accent-ink:#FFFFFF;--sq:#E5484D;--bn:#3D8BFD;--dl:#F2B52E;--ok:#2FA56A;--warn:#F08C2E;--danger:#E5484D;
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0F12;--surface:#16191E;--raise:#1E2228;--line:#2A3038;--ink:#F1F3F6;--muted:#8A93A0}}
:root[data-theme="dark"]{--bg:#0D0F12;--surface:#16191E;--raise:#1E2228;--line:#2A3038;--ink:#F1F3F6;--muted:#8A93A0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

main{max-width:600px;margin:0 auto;padding:12px 16px 150px}
h1{font:700 38px/1 var(--fd);margin:6px 0 14px}
h2{font:700 22px/1.1 var(--fd);margin:0 0 8px}
h3{font:600 16px/1.25 var(--fb);margin:0}
p{margin:0 0 8px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:14px}.xs{font-size:12px}
.stripe{display:flex;gap:3px;height:5px;width:48px}
.stripe i{flex:1;border-radius:2px}
.stripe i:nth-child(1){background:var(--sq)}.stripe i:nth-child(2){background:var(--bn)}.stripe i:nth-child(3){background:var(--dl)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec-title h2{margin:0}

.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 16px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);background:transparent;border-color:var(--line)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.start{width:100%;min-height:64px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:700 24px/1 var(--fd);letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;padding:0}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 14px;font-weight:600;min-height:36px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--raise2);color:var(--ink)}

.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--raise);min-height:64px}
.tile b{font:700 20px/1 var(--fd)}
.tile span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.lift-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:1px}
.liftcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;border-top:3px solid var(--lc)}
.liftcard .v{font:700 32px/1 var(--fd);font-variant-numeric:tabular-nums;margin-top:6px}
.liftcard .l{font-size:13px;color:var(--muted)}

label.field{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:500}
.inp{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;color:var(--ink)}
.inp:focus{border-color:var(--accent);outline:none}
.inp.bad,.set-grid input.bad{border-color:var(--danger)!important;background:color-mix(in srgb,var(--danger) 12%,var(--raise))!important}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.err{font-size:13px;color:var(--danger);margin-top:6px;min-height:1em}

table{border-collapse:collapse;width:100%}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.now td{background:var(--raise);font-weight:600}
tr.now td:first-child{box-shadow:inset 3px 0 var(--accent)}
.scroll-x{overflow-x:auto}

.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.list-item b{display:block;font-weight:600}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--raise);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;margin:0}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;background:var(--raise2);object-fit:cover}

.count{display:flex;align-items:flex-end;gap:12px}
.count .big{font:700 96px/.8 var(--fd);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.count .unit{font:600 20px/1.15 var(--fd);color:var(--muted);padding-bottom:4px}
.stat b{display:block;font:700 28px/1 var(--fd);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs button{flex:1;background:none;border:0;padding:6px 4px;border-radius:10px;font:600 12px/1 var(--fb);color:var(--dim);min-height:50px;display:flex;flex-direction:column;align-items:center;gap:5px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}

.resume{display:flex;align-items:center;gap:12px;width:100%;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:16px;padding:14px 16px;text-align:left;margin-bottom:12px}
.resume b{font:700 20px/1.1 var(--fd)}
.float-resume{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:21;max-width:576px;margin:0 auto;display:none}
.float-resume.show{display:block}
.float-resume button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:50px;box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* Workout */
#wk{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#wk.open{display:flex}
.wk-head{border-bottom:1px solid var(--line);padding:8px 12px;background:var(--bg)}
.wk-head .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.wk-title{font:700 22px/1.05 var(--fd)}
.wk-body{flex:1;overflow-y:auto;padding:12px 10px 170px;width:100%}
.wk-body>.in{max-width:600px;margin:0 auto}
.wk-stats{display:flex;gap:18px;padding:4px 4px 12px}
.wk-stats div{font-size:13px;color:var(--muted)}
.wk-stats b{display:block;color:var(--ink);font:700 20px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;margin-bottom:12px}
.ex.comp{box-shadow:inset 4px 0 var(--lc)}
.ex-name{font:700 20px/1.1 var(--fd);color:var(--ink)}
.ex.comp .ex-name{color:var(--lc)}
.set-grid{display:grid;grid-template-columns:30px minmax(0,1fr) 66px 52px 52px 44px;gap:6px;align-items:center}
.set-grid.head{font-size:12px;color:var(--dim);font-weight:600;margin:10px 0 4px;text-align:center}
.set-grid input{width:100%;min-width:0;border:1px solid transparent;background:var(--raise);border-radius:9px;padding:8px 4px;text-align:center;min-height:42px;font-weight:600;font-variant-numeric:tabular-nums}
.set-grid input:focus{border-color:var(--accent);outline:none}
.set-grid input::placeholder{color:var(--dim);font-weight:500}
.set-row{padding:3px 2px;border-radius:10px;margin:0 -2px}
.set-row.done{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.set-row.done input{background:transparent}
.sn{font:700 17px/1 var(--fd);text-align:center;color:var(--muted)}
.prev{font-size:13px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:44px;height:42px;border-radius:9px;border:0;background:var(--raise2);display:grid;place-items:center;color:var(--muted)}
.set-row.done .chk{background:var(--ok);color:#fff}
.target{font-size:14px;color:var(--muted)}
.vid{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:10px;padding:8px 4px 0;border-top:1px solid var(--line)}
.vid input{width:20px;height:20px;accent-color:var(--accent)}

#wkbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none}
#wkbar.show{display:block}
#wkbar .in{max-width:600px;margin:0 auto}
.restbar{height:4px;background:var(--raise2);border-radius:2px;margin-bottom:10px;overflow:hidden}
.restbar i{display:block;height:100%;background:var(--accent);width:0}
.rest-clock{font:700 34px/1 var(--fd);font-variant-numeric:tabular-nums;min-width:86px}
#wkbar.over .rest-clock{color:var(--dl)}
#wkbar.over .restbar i{background:var(--dl)}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--dim);margin:0 auto 14px;box-sizing:content-box;padding:8px 40px;background-clip:content-box;touch-action:none}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--raise);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);margin-bottom:12px}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:12px var(--fb);fill:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px;color:var(--muted)}

/* Onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.ob-hero{flex:1;display:flex;flex-direction:column;justify-content:center}
.ob-hero .brand{font:700 84px/.85 var(--fd);letter-spacing:-1px;margin:18px 0 14px}
.ob-steps{display:flex;gap:6px;margin:6px 0 22px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ob-steps i.on{background:var(--accent)}
.role{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--raise);margin-bottom:8px}
.role[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--raise))}
.role b{display:block;font-weight:600}
.code{font:700 34px/1 var(--fd);letter-spacing:6px;font-variant-numeric:tabular-nums}
.code-inp{text-transform:uppercase;letter-spacing:6px;font:700 26px/1 var(--fd);text-align:center}
.rt-row{display:grid;grid-template-columns:1fr 54px 70px 36px;gap:6px;margin-bottom:6px}

/* ===== v8 features ===== */
#prb{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--lc,var(--dl)) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--lc,var(--dl)) 60%,var(--line));box-shadow:0 12px 30px rgba(0,0,0,.5);transform:translateY(-140%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#prb.show{transform:none}
#prb .medal{width:40px;height:40px;border-radius:50%;background:var(--lc,var(--dl));display:grid;place-items:center;color:#fff;font:700 15px var(--fd);flex:none}
.prtag{font:700 11px var(--fb);color:var(--dl);letter-spacing:.2px}
.set-row.wu .sn b{color:var(--warn)}
.set-row.haspr{box-shadow:inset 3px 0 var(--dl)}
.ex.ss{border-left:4px solid var(--accent)}
.ss-tag{font-size:12px;font-weight:700;color:var(--accent)}
.ex-note{width:100%;min-height:42px;resize:vertical;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 12px;color:var(--ink);font:15px/1.4 var(--fb);margin-top:10px}
.mrow{padding:12px 0;border-bottom:1px solid var(--line)}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--raise2);margin-top:8px;overflow:hidden}
.mbar .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 25%,transparent)}
.mbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.mini8{display:flex;gap:3px;align-items:flex-end;height:22px}
.mini8 i{width:6px;border-radius:2px;background:var(--raise2);min-height:2px}
.mini8 i.cur{background:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:12px;color:var(--dim);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:15px;background:transparent;border:1px solid transparent;color:var(--muted);padding:0}
.cal .d.on{background:var(--accent);color:#fff}
.cal .d.today{border-color:var(--ink);color:var(--ink)}
.cal .d.on.today{border-color:#fff}
.plates{display:flex;align-items:center;justify-content:center;gap:4px;min-height:120px;margin:14px 0}
.plates .bar{width:70px;height:10px;border-radius:4px;background:var(--muted)}
.plates .pl{border-radius:5px;display:grid;place-items:center;font:700 12px var(--fd);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg)}
.rpe-t td,.rpe-t th{text-align:center;padding:8px 4px}
.rpe-t td b{display:block;font:700 17px var(--fd)}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-height:84px}
.tool b{font-weight:600}
/* ===== v5 spacing ===== */
main{padding-top:64px!important;padding-left:20px!important;padding-right:20px!important;padding-bottom:190px!important}
.home-head{margin:0 0 24px;padding-right:10px}
.start{margin:0 0 22px!important}
.hero{padding:22px 20px 18px!important;margin-bottom:20px!important}
.hero .big{font-size:88px!important;line-height:.8!important;letter-spacing:-2px}
.hero .lbl{font-size:19px}
svg.barbell{max-width:380px!important;margin:26px auto 4px!important}
.card.grid3{margin-top:4px}
nav.tabs{padding-bottom:max(22px,calc(10px + env(safe-area-inset-bottom,0px)))!important}
.float-resume{bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
/* ===== v4 fixes ===== */
label.field,.grid2>*,.grid3>*{min-width:0}

.date-ph{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;font-size:16px}
/* ===== v3 polish ===== */
main{padding:30px 18px 170px}
h1{font-size:44px;margin-bottom:18px}
h2{font-size:24px}
.card{padding:18px;border-radius:20px;margin-bottom:14px}

.btn{min-height:48px}
.start{min-height:68px;border-radius:18px;font-size:26px;margin:6px 0 16px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 16px;margin-bottom:14px}

svg.barbell{width:100%;max-width:360px;height:auto;display:block;margin:22px auto 0}
svg.barbell text{font:700 15px var(--fd);fill:var(--ink)}
.liftcard{background:color-mix(in srgb,var(--lc) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--lc) 40%,var(--line));border-top:1px solid color-mix(in srgb,var(--lc) 40%,var(--line));border-radius:18px;padding:14px}

.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}

.att-grid .xs{text-align:center}
/* workout */
.wk-body{padding:14px 12px 190px}
.ex{border-radius:20px;padding:0 12px 12px;margin-bottom:14px;overflow:hidden}
.ex.comp{box-shadow:none;border-color:color-mix(in srgb,var(--lc) 40%,var(--line))}

.ex-name{font-size:23px}
.set-grid{grid-template-columns:46px repeat(3,minmax(0,1fr)) 50px;gap:8px}

.set-grid input{min-height:50px;font-size:19px;border-radius:12px}

@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes flash{0%{background:color-mix(in srgb,var(--ok) 45%,transparent)}100%{background:color-mix(in srgb,var(--ok) 18%,transparent)}}

.pr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--lc,var(--accent)) 14%,var(--raise));border:1px solid color-mix(in srgb,var(--lc,var(--accent)) 40%,var(--line));margin-bottom:8px}

/* ===== v14: refined chalk and steel ===== */
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){
  --bg:#15171A;--surface:#1F2226;--raise:#262A2E;--raise2:#2E3237;--line:#2E3237;--ink:#ECE9E2;--muted:#A19D94;--dim:#76726B;
  --accent:#ECE9E2;--accent-ink:#15171A;--sq:#C0443A;--bn:#4476CC;--dl:#D2A43C;--ok:#4E8E62;--warn:#D0923F;--danger:#C9463C;
  --fd:"Saira Condensed","Arial Narrow",Arial,sans-serif;--fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --card:linear-gradient(180deg,#23262A,#1D2023);--hi:inset 0 1px 0 rgba(255,255,255,.06);
  --knurl:repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 1.5px,transparent 1.5px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.028) 0 1.5px,transparent 1.5px 6px);
}
html,body{background:#15171A}
body{font-family:var(--fb);color:var(--ink)}
h1{font:800 42px/1 var(--fd);letter-spacing:0}
h2{font:700 24px/1.1 var(--fd);letter-spacing:.2px}
.card,.list-item,.tile,.att-card,.ex,.tool,.hero{background:var(--card)!important;border-color:var(--line)!important;box-shadow:var(--hi)}
.lift-row{box-shadow:var(--hi)}
.tile:active,.list-item:active,.tool:active{transform:scale(.985)}
.btn{background:linear-gradient(180deg,#2A2D32,#23262A);border-color:#373B41;box-shadow:var(--hi);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.danger{background:transparent;box-shadow:none}
.btn.primary,.start{background:linear-gradient(180deg,#F4F1EA,#DAD5CA)!important;color:#15171A!important;border:1px solid #F4F1EA!important;box-shadow:0 3px 0 #8F8A80,inset 0 1px 0 #fff!important}
.btn.primary:active,.start:active{transform:translateY(2px);box-shadow:0 1px 0 #8F8A80,inset 0 1px 0 #fff!important}
.start{font:800 27px/1 var(--fd)!important;min-height:66px!important;border-radius:14px!important}
.start svg path{fill:#15171A}
.icon-btn{background:linear-gradient(180deg,#2A2D32,#212428);border-color:#33373D;box-shadow:var(--hi)}
.chip{background:#23262A;border-color:#373B41}
.chip[aria-pressed="true"]{background:#ECE9E2;color:#15171A;border-color:#ECE9E2}
.seg{background:#1A1C1F;border-color:#2B2F34}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#34383E,#2A2D32);color:var(--ink);box-shadow:var(--hi)}
.inp{background:#1A1C1F;border-color:#33373D}
.inp:focus,.set-grid input:focus{border-color:#ECE9E2!important}
.pill{background:#262A2E;border-color:#373B41}
.pill.acc{color:#ECE9E2;border-color:#6F6B64;background:#2A2D32}
.hdr{margin:0 -20px 18px;padding:64px 20px 18px;background:var(--knurl),#1C1F23;border-bottom:1px solid #2B2F34}
.hdr h1{margin:0}
main{padding-top:0!important}
nav.tabs{background:#111315!important;border-top-color:#2B2F34}
nav.tabs button{font:600 11px/1 var(--fb)}
nav.tabs button[aria-current="page"] svg{stroke:#ECE9E2}
.float-resume button{background:linear-gradient(180deg,#F4F1EA,#DAD5CA);color:#15171A;box-shadow:0 3px 0 #8F8A80,0 10px 24px rgba(0,0,0,.5)}
.resume{background:var(--card);border-color:#6F6B64}
.cal .d.on{background:#ECE9E2;color:#15171A}
.cal .d.on.today{border-color:#15171A;box-shadow:0 0 0 2px #ECE9E2}
.week.now{border-color:#ECE9E2;background:#2A2D32}
.mini8 i.cur{background:#ECE9E2}
.ob-steps i.on{background:#ECE9E2}
/* home hero */
.hero{border-radius:20px!important;padding:18px 18px 14px!important}
.hero .big{font:800 80px/.82 var(--fd)!important;letter-spacing:-1px}
.hero .lbl{font:500 14px/1.3 var(--fb)!important;color:#B3AFA6}
svg.barbell text{font-family:var(--fd)}
.upnext{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--hi);padding:14px 16px;margin-bottom:14px}
.rim{width:40px;height:40px;border-radius:50%;border:6px solid var(--lc,#6F6B64);box-sizing:border-box;background:#15171A;flex:none}
/* workout */
#wk{background:#15171A}
.wk-head{background:#1C1F23;border-bottom-color:#2B2F34}
.wk-title{font:800 24px/1 var(--fd)}
.wk-stats b{font:800 24px/1.1 var(--fd)}
.ex{padding:0 10px 12px!important;border-radius:20px!important}
.ex-head{margin:0 -10px 4px!important;padding:14px 14px 12px!important;gap:12px}
.ex.comp{border-color:var(--line)!important}
.ex.comp .ex-head{background:var(--knurl),linear-gradient(180deg,color-mix(in srgb,var(--lc) 24%,transparent),color-mix(in srgb,var(--lc) 6%,transparent))!important}
.ex.comp .ex-head::before{content:"";width:38px;height:38px;border-radius:50%;border:6px solid var(--lc);box-sizing:border-box;background:#15171A;flex:none;align-self:center}
.ex.comp .ex-name{color:var(--ink)!important}
.ex-name{font:800 23px/1.05 var(--fd)!important}
.set-grid input{background:#1A1C1F;border:1px solid #33373D;font:800 22px/1 var(--fd)!important}
.set-row.done{background:rgba(78,142,98,.16)!important}
.set-row.done input{background:transparent;border-color:transparent}
.set-row.done .chk{background:#4E8E62;color:#fff}
.set-row.wu .sn b{color:#C98A3A}
.sn b{font:800 20px/1 var(--fd)!important}
.chk{background:#262A2E;border:1px solid #33373D;color:#8A867E}
.ex.ss{border-left:4px solid #ECE9E2!important}
.ss-tag{color:#ECE9E2}
#wkbar{background:#1C1F23;border-top-color:#2B2F34}
.ring .fg{stroke:#ECE9E2}
.rest-clock{font:800 38px/1 var(--fd)!important}
/* motion */
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#modal.open .sheet{animation:sheetIn .24s cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion:reduce){#modal.open .sheet{animation:none}}
.sheet{background:#1C1F23;border-color:#2E3237}
.grab{background:#4A4E55!important;background-clip:content-box!important}
.toast{background:#ECE9E2;color:#15171A}

.hdr{background:linear-gradient(180deg,rgba(21,23,26,.35),rgba(21,23,26,.74)),radial-gradient(ellipse at 50% -20%,rgba(255,196,128,.22),rgba(255,196,128,0) 60%),var(--tx-wall) center 30%/520px #1c1916!important;border-bottom:1px solid #0E0F10!important;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.hdr h1{font:900 46px/.9 var(--stencil)!important;letter-spacing:1.5px;text-transform:uppercase;color:#EDE7DA;-webkit-mask-image:var(--tx-mask);mask-image:var(--tx-mask);-webkit-mask-size:520px;mask-size:520px}
.hdr .small.muted{color:#CFC8BA}
.iron{position:relative;border-radius:50%;background:linear-gradient(160deg,rgba(62,60,58,.82),rgba(30,29,28,.9)),var(--tx-rust) center/240px #2a2826;box-shadow:0 6px 14px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.5),inset 0 0 18px rgba(0,0,0,.55)}
.iron .rimp{position:absolute;inset:3px;border-radius:50%;border:8px solid var(--pc);-webkit-mask-image:var(--tx-mask);mask-image:var(--tx-mask);-webkit-mask-size:520px;mask-size:520px}

function queue(fn){if(S.demo){toast('Demo mode: nothing is saved');return Promise.resolve()}
  if(S.readOnly){toast('Your account can\'t save to Chalk yet. Ask the person who shared it to invite you as a Contributor, then reopen it.');return Promise.resolve(false)}
  writeChain=writeChain.then(async()=>{
    const now=Date.now();while(writeTimes.length&&now-writeTimes[0]>60000)writeTimes.shift();
    if(writeTimes.length>=30){const wait=60000-(now-writeTimes[0]);toast('Saving slowed down, too many changes at once');await sleep(wait);}
    writeTimes.push(Date.now());await fn();S.writeOk=true;return true;
  }).catch(err=>{console.error(err);const c=err&&err.code;
    if(c==='invalid_argument'&&!S.writeOk){S.readOnly=true;toast('Your account can\'t save to Chalk yet. Ask the person who shared it to invite you as a Contributor, then reopen it.');setTimeout(render,0);return false}
    toast(c==='permission-denied'?'That change was blocked by your team permissions.':c==='resource-exhausted'?'Too many changes too fast. Wait a moment.':c==='quota_exceeded'?'Storage is full. Delete old workouts to keep saving.':c==='invalid_argument'?'That change was blocked. You can only edit your own data.':c==='resource_exhausted'?'Too many changes too fast. Wait a moment.':'Could not save. Check your connection.');return false;});
  return writeChain;
}

function teamCompare(p){const tid=p.teamId;if(!tid||S.mode!=='cloud')return '';const mem=S.allLifters.filter(m=>m.teamId===tid&&m.role!=='coach');if(mem.length<2)return '';

function wItem(w){const sets=w.exercises.reduce((a,e)=>a+e.sets.length,0);

/* ---- History ---- */

/* ---- Progress ---- */
const DIST_AXES=['Chest','Lats','Upper back','Front delts','Side delts','Rear delts','Biceps','Triceps','Abs','Quads','Hamstrings','Glutes','Calves'];
function periodStats(from,to){const ws=S.workouts.filter(w=>w.date>=from&&w.date<to);const m={};let sets=0,vol=0,dur=0;
  for(const w of ws){dur+=w.dur||0;for(const ex of w.exercises){const mu=muscleOf(ex.name);for(const st of ex.sets){if(st.wu||(st.w==null&&st.r==null))continue;const v=(st.w||0)*(st.r||0);sets++;vol+=v;const o=m[mu]||(m[mu]={sets:0,vol:0,sec:0});o.sets++;o.vol+=v;for(const sm of secOf(ex.name)){const q=m[sm]||(m[sm]={sets:0,vol:0,sec:0});q.sec++}}}}
  return {workouts:ws.length,sets,vol:Math.round(vol),dur,m}}
function fmtVol(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?Math.round(v/1e3)+'k':v.toLocaleString()}
function radar(cur,prev,key){const n=DIST_AXES.length,cx=170,cy=165,R=100;const val=(d,a)=>(d.m[a]||{})[key]||0;
  const mx=Math.max(1,...DIST_AXES.map(a=>Math.max(val(cur,a),val(prev,a))));
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)]};
  let g='';for(let k=1;k<=4;k++){g+=`<polygon points="${DIST_AXES.map((_,i)=>pt(i,R*k/4).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`}
  DIST_AXES.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`});
  const poly=(d,col,op)=>`<polygon points="${DIST_AXES.map((a,i)=>pt(i,Math.max(3,R*val(d,a)/mx)).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  g+=(Object.keys(prev.m).length?poly(prev,'#8A93A0',.12):'')+poly(cur,'var(--accent)',.28);
  DIST_AXES.forEach((a,i)=>{const[x,y]=pt(i,R+20);const anc=Math.abs(x-cx)<8?'middle':x>cx?'start':'end';const sel=S.distSel===a;
    g+=`<g data-a="distMuscle" data-m="${a}" style="cursor:pointer"><rect x="${(anc==='start'?x-4:anc==='end'?x-80:x-40).toFixed(1)}" y="${(y-12).toFixed(1)}" width="84" height="22" fill="transparent"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}" style="font:${sel?'700':'500'} 12px var(--fb);fill:${sel?'var(--ink)':'var(--muted)'}">${a}</text></g>`});
  return `<svg class="chart" viewBox="-52 8 444 318" role="img" aria-label="Muscle distribution radar chart">${g}</svg>`}
function deltaHtml(c,p,fmt){const d=c-p;if(!d)return '<span class="xs muted">No change</span>';const up=d>0;return `<span style="color:${up?'var(--ok)':'var(--danger)'};font-weight:600">${up?'↑':'↓'} ${fmt(Math.abs(d))}</span>`}
function distSection(){const days=S.distRange||30,key=S.distMetric||'sets';const all=days==='all';const now=Date.now(),span=all?0:days*864e5;
  const cur=all?periodStats(0,now+1):periodStats(now-span,now),prev=all?{workouts:0,sets:0,vol:0,dur:0,m:{}}:periodStats(now-2*span,now-span);
  const sel=S.distSel;const sc=sel?Object.assign({sets:0,vol:0,sec:0},cur.m[sel]):null,sp=sel?Object.assign({sets:0,vol:0,sec:0},prev.m[sel]):null;

/* ---- Meet ---- */
function meetState(){return S.meetDay}
function saveMeetLocal(){lsSet('chalk-meetday',S.meetDay)}
function viewMeetDay(){const m=S.meetDay;const bw=num(m.bw);
  let total=0,okAll=true,warn=[];const best={};
  const cards=LIFTS.map(L=>{const at=m.lifts[L.k];const goods=at.filter(a=>a.res==='good').map(a=>kgLoad(num(a.w)));best[L.k]=goods.length?Math.max(...goods):null;if(best[L.k])total+=best[L.k];else okAll=false;
    const misses=at.filter(a=>a.res==='miss').length;if(!best[L.k]&&misses===2)warn.push(`${L.n}: one attempt left to stay in the meet. Consider a safe third.`);if(!best[L.k]&&misses===3)warn.push(`${L.n}: no successful attempt.`);
    return `<div class="att-card" style="--lc:${L.c}"><div class="row between"><span class="name">${L.n}</span><span class="small">Best: <b>${best[L.k]?best[L.k]+' kg':'—'}</b></span></div>
    ${at.map((a,i)=>{const w=num(a.w);const kg=w?Math.round(w/2.20462/2.5)*2.5:null;const open=i===0||at[i-1].res;return `<div class="row" style="margin-top:10px;gap:8px;${open?'':'opacity:.45'}"><span class="muted" style="width:26px;font:700 18px var(--fd)">${i+1}</span>
      <span class="grow"><input class="inp" inputmode="decimal" data-md="${L.k}:${i}" value="${esc(a.w??'')}" placeholder="lbs" style="font:700 20px var(--fd);text-align:center;${a.res==='good'?'border-color:var(--ok)':a.res==='miss'?'border-color:var(--danger)':''}" ${a.res?'disabled':''}><span class="xs muted" style="display:block;text-align:center;margin-top:3px">${kg?`load ${kg} kg (${(kg*2.20462).toFixed(1)} lbs)`:'&nbsp;'}</span></span>
      ${a.res?`<span class="pill ${a.res==='good'?'ok':''}" style="${a.res==='miss'?'color:var(--danger)':''}">${a.res==='good'?'Good':'No lift'}</span><button class="btn sm ghost" data-a="mdUndo" data-v="${L.k}:${i}" aria-label="Undo">↺</button>`:open?`<button class="btn sm" style="color:var(--ok)" data-a="mdRes" data-v="${L.k}:${i}:good">Good</button><button class="btn sm" style="color:var(--danger)" data-a="mdRes" data-v="${L.k}:${i}:miss">No</button>`:''}</div>`}).join('')}</div>`}).join('');
  const d=okAll?dots(total*2.20462,bw,S.profile.sex):null;
  return `${header('Meet day',false)}
  <div class="hero slate"><div class="small muted">${esc(m.name)}</div><div class="row between" style="align-items:flex-end"><div><span class="big chalk-num" style="font-size:72px">${total||0}</span><div class="lbl">kg total${okAll?'':' so far'}, ${kgToLb(total)} lbs</div></div><div style="text-align:right"><div class="small muted">DOTS</div><b style="font:700 28px var(--fd)">${d||'—'}</b></div></div>
    <label class="field" style="margin-top:14px">Weigh-in bodyweight (lbs)<input class="inp" inputmode="decimal" data-mbw="1" value="${esc(m.bw??'')}"></label></div>
  ${meetTimeline(S.profile,m)?timelineCard(S.profile,true):''}
  ${warn.map(x=>`<div class="card" style="border-color:var(--danger);padding:12px 16px"><b style="color:var(--danger)">Heads up</b><p class="small" style="margin:4px 0 0">${esc(x)}</p></div>`).join('')}
  ${cards}
  <p class="xs muted">After a good lift, the next attempt fills in about 4% heavier (3% for thirds), rounded to 2.5 kg since meets load in kilos. Your total uses the kilos on the bar. After a miss it repeats the weight. Edit anything before you call it.</p>
  <div class="grid2" style="margin-top:12px"><button class="btn danger" data-a="mdCancel">Exit without saving</button><button class="btn primary" data-a="mdFinish">Finish meet</button></div>`}
function viewMeet(){

  <div class="card grid3"><div class="stat"><b>${tot||'—'}</b><span>Est. total (lbs)</span></div><div class="stat"><b>${bwNow||'—'}</b><span>Bodyweight</span></div><div class="stat"><b>${dsc||'—'}</b><span>DOTS${p.sex?'':' (set sex in Profile)'}</span></div></div>
  <div class="card">${countTxt}
    ${S.teamMeetOn?`<p class="small" style="margin:14px 0 0;color:#D6D1C7"><b>${esc(p.meetName)}</b>, ${fmtDateY(+parseDay(p.meetDate))}. Set by your coach.</p>`:''}<div class="grid2" style="margin-top:18px;${S.teamMeetOn?'display:none':''}"><label class="field">Meet name<input class="inp" data-p="meetName" maxlength="${LIM.meet}" value="${esc(p.meetName)}"></label><label class="field">Meet date<span class="date-wrap"><input class="inp" type="date" min="2020-01-01" max="2035-12-31" data-p="meetDate" value="${esc(p.meetDate)}">${p.meetDate?'':'<span class="date-ph">Tap to set</span>'}</span></label></div></div>
  <div class="sec-title"><h2>Weight class</h2></div>

  ${teamCompare(p)}
  <div class="sec-title"><h2>Block 1 targets</h2></div>
  <div class="card"><p class="small muted" style="margin:0">RPE for the comp lifts. Sets and reps stay fixed; add weight only inside the target. Accessories stay at 9–10.</p>
    <div class="weeks">${AP_RPE.map((r,i)=>`<div class="week ${bw===i+1?'now':''}"><span>Week ${i+1}</span><b>${r}</b></div>`).join('')}</div>
    <p class="small" style="margin:0"><b>Tue</b> <span class="muted">bench 3×5</span>&nbsp;&nbsp;<b>Wed</b> <span class="muted">deadlift 3×4</span>&nbsp;&nbsp;<b>Sat</b> <span class="muted">squat 3×5, bench 3×5</span></p>
    <label class="field" style="margin-top:14px">Block start date<span class="date-wrap"><input class="inp" type="date" min="2020-01-01" max="2035-12-31" data-p="blockStart" value="${esc(p.blockStart)}">${p.blockStart?'':'<span class="date-ph">Tap to set</span>'}</span></label></div>

function teamMembers(){const tid=S.profile.teamId;if(!tid)return [];return S.allLifters.filter(t=>t.teamId===tid).map(t=>Object.assign({},t,{role:statusOf(t.id,t)})).filter(t=>t.role==='lifter'||t.role==='coach')}
function pendingMembers(){const tid=S.profile.teamId;if(!tid)return [];return S.allLifters.filter(t=>t.teamId===tid&&statusOf(t.id,t)==='pending')}
function leaderboard(lifters){if(!lifters.length)return '';const mode=(S.demo||isCoach())?(S.lbMode||'total'):'total';
  const rows=lifters.map(m=>{const t=totalOf(m,null);const bw=latestBw(m);return {m,total:t,dots:dots(t,bw,m.sex),streak:liveStreak(m)}}).map(r=>({...r,v:r[mode]})).sort((a,b)=>(b.v||0)-(a.v||0));

function lifterProgCard(){const pg=activeProg();if(!pg)return '';const w=progWeekOf(pg);return `<div class="card"><div class="xs muted">Team program</div><b style="font:700 22px var(--fd)">${esc(pg.name)}</b><div class="small muted">${w<1?`Starts ${fmtDate(+parseDay(pg.start))}`:`Week ${Math.min(w,pg.weeks)} of ${pg.weeks}`}, ${pg.days.map(d=>DOW[d.dow].slice(0,3)).join(', ')}</div><button class="btn sm" style="margin-top:10px" data-a="pickRoutine">Open program</button></div>`}

function syncPB(){if(!PB)return;sheet.querySelectorAll('[data-pb]').forEach(el=>{const k=el.dataset.pb,v=el.value;if(k==='name')PB.name=v;else if(k==='start')PB.start=v;else if(k==='weeks'){const n=parseInt(v)||4;if(n!==PB.weeks){PB.weeks=n;PB.days.forEach(d=>d.ex.forEach(e=>{e.rpe=Array.from({length:n},(_,i)=>e.rpe[i]??e.rpe[e.rpe.length-1]??'')}))}}
  else{const m=k.match(/^d(\d+)(t|dow|e(\d+)(n|s|r|p(\d+)))$/);if(!m)return;const d=PB.days[+m[1]];if(!d)return;if(m[2]==='t')d.t=v;else if(m[2]==='dow')d.dow=+v;else{const e=d.ex[+m[3]];if(!e)return;const f=m[4];if(f==='n')e.name=v;else if(f==='s')e.sets=v;else if(f==='r')e.reps=v;else{const wi=+m[5];e.rpe[wi]=v;if(wi===0&&!compKey(e.name))e.rpe=e.rpe.map(()=>v)}}}})}

  if(bad){toast('Fix the highlighted sets first. Weight 0–2000, reps 0–100, RPE 1–10 in halves.');rerenderWk();return}
  const prs=[];

function impRead(){const f=$('#impFile').files[0];const out=$('#impOut'),btn=$('#impBtn');if(!f)return;if(f.size>15e6){out.innerHTML='<p class="err">That file is over 15 MB.</p>';return}
  const rd=new FileReader();rd.onload=()=>{let r;try{r=importFrom(String(rd.result),$('#impUnit').value)}catch(e){r={err:'Could not read that file.'}}S.impResult=r;
    if(r.err){out.innerHTML=`<p class="err"></p>`;out.querySelector('.err').textContent=r.err;btn.disabled=true;return}
    const ws=r.workouts;const top={};ws.forEach(w=>w.exercises.forEach(e=>top[e.name]=(top[e.name]||0)+1));const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
    out.innerHTML=`<div class="card" style="margin:0"><b style="font:700 22px var(--fd)">${ws.length} workouts, ${r.sets.toLocaleString()} sets</b><div class="small muted">From ${r.fmt==='hevy'?'Hevy':r.fmt==='strong'?'Strong':'Chalk'}${ws.length?`, ${fmtDateY(ws[0].date)} to ${fmtDateY(ws[ws.length-1].date)}`:''}${r.dup?`. Skipping ${r.dup} already in your log.`:''}</div><div class="xs muted" style="margin-top:8px" id="impTop"></div></div>`;
    $('#impTop').textContent='Most logged: '+tops.map(([n,c])=>`${n} (${c})`).join(', ');btn.disabled=!ws.length};rd.readAsText(f)}
function modalQuick(ei){const ex=S.active.exercises[ei];const n=ex.name.toLowerCase();const ses=[];for(const w of S.workouts){if(w.id===S.active.editOf)continue;const e=w.exercises.find(x=>x.name.toLowerCase()===n);if(e)ses.push({w,e});if(ses.length>=3)break}

function drawWW(){const st=S.ww;const el=$('#wwOut');if(!el)return;const L=LIFTS.find(x=>x.k===st.k);const sg=sbdSuggest(st.k,st.reps,{lo:Math.min(st.lo,st.hi),hi:Math.max(st.lo,st.hi)});

  el.innerHTML=`<div class="card" style="margin:0"><div class="xs muted">${st.sets}×${st.reps} @ RPE ${st.lo===st.hi?st.lo:Math.min(st.lo,st.hi)+'–'+Math.max(st.lo,st.hi)}</div>

    <div class="small muted">${sg.lo===sg.hi?kg(sg.lo):kg(sg.lo)+'–'+kg(sg.hi)} kg${pr.under?'':`. Plates per side at ${sg.lo}: ${pr.used.length?pr.used.join(' + '):'bar only'}`}</div>

function saveMuscles(name,main,sec){const k=name.toLowerCase();const mm=Object.assign({},S.profile.muscleMap),sm=Object.assign({},S.profile.secMap);
  if(MUSCLES.includes(main)&&main!==MUSCLE_MAP[k])mm[k]=main;else if(main===MUSCLE_MAP[k])delete mm[k];

S.progs={};
function sanitizeProg(id,author,d){if(!d||typeof d!=='object')return null;const weeks=Math.max(1,Math.min(16,parseInt(d.weeks)||4));
  const days=(Array.isArray(d.days)?d.days:[]).slice(0,7).map(x=>({t:cleanStr(x&&x.t,30)||'Day',dow:Math.max(0,Math.min(6,parseInt(x&&x.dow)||0)),
    ex:(Array.isArray(x&&x.ex)?x.ex:[]).slice(0,LIM.exPerRoutine).map(e=>({name:cleanStr(e&&e.name,LIM.exName),sets:Math.max(1,Math.min(LIM.setsPerEx,parseInt(e&&e.sets)||1)),reps:Math.max(0,Math.min(50,parseInt(e&&e.reps)||0)),
      rpe:Array.from({length:weeks},(_,i)=>cleanStr(Array.isArray(e&&e.rpe)?(e.rpe[i]??e.rpe[0]):(e&&e.rpe),LIM.rpeTxt))})).filter(e=>e.name)})).filter(x=>x.ex.length);
  const start=typeof d.start==='string'&&parseDay(d.start)?d.start:'';if(!days.length)return null;
  return {id:String(id),author,teamId:cleanStr(d.teamId,200),name:cleanStr(d.name,LIM.routine)||'Team program',start,weeks,days,createdAt:num(d.createdAt)||0}}
function allProgs(){return Object.values(S.progs).flat().filter(p=>p.teamId===S.profile.teamId).sort((a,b)=>(b.start||'').localeCompare(a.start||'')||b.createdAt-a.createdAt)}
function progWeekOf(pg){const s=parseDay(pg.start);if(!s)return null;return Math.floor(Math.round((today0()-s)/864e5)/7)+1}
function activeProg(){const ps=allProgs();let cur=null,up=null;for(const pg of ps){const w=progWeekOf(pg);if(w==null)continue;if(w>=1&&w<=pg.weeks){if(!cur)cur=pg}else if(w<1&&w>=-1){if(!up||pg.start<up.start)up=pg}}return cur||up}
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function progDayEx(pg,di,wk){const w=Math.max(0,Math.min(pg.weeks-1,wk-1));return pg.days[di].ex.map(e=>({name:e.name,sets:e.sets,reps:e.reps||'',rpe:e.rpe[w]||e.rpe[0]||''}))}
function startProgDay(pg,di,wk){const d=pg.days[di];startWorkout({name:d.t,sub:`${pg.name}, week ${wk}, ${DOW[d.dow]}`,program:'team:'+pg.id,week:wk,exercises:progDayEx(pg,di,wk)})}

function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];

  else if(c==='"')q=true;else if(c===','||c===';'&&false){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  m=s.match(/^(\d{1,2}) (\w{3})\w* (\d{4}),? (\d{1,2}):(\d{2})/);if(m&&MON[m[2].toLowerCase()]!=null)return +new Date(+m[3],MON[m[2].toLowerCase()],+m[1],+m[4],+m[5]);
  const t=Date.parse(s);return isFinite(t)?t:null}
function parseDur(s){s=String(s||'');let ms=0;const h=s.match(/(\d+)\s*h/),mi=s.match(/(\d+)\s*m(?!s)/),se=s.match(/(\d+)\s*s/);if(h)ms+=h[1]*36e5;if(mi)ms+=mi[1]*6e4;if(!h&&!mi&&/^\d+$/.test(s.trim()))ms=+s*1000;else if(se)ms+=se[1]*1000;return ms}

  const base=l.replace(/\s*\((barbell|dumbbell|machine|cable|smith machine|band|bodyweight|ez bar|plate loaded)\)\s*$/,'');const known=allExerciseNames().find(x=>x.toLowerCase()===base||x.toLowerCase()===l);return known||n}
function importFrom(text,unit){const rows=parseCSV(text);if(rows.length<2)return {err:'That file has no rows.'};const H=rows[0].map(h=>h.replace(/^\uFEFF/,'').trim());const ix=k=>H.findIndex(h=>h.toLowerCase()===k.toLowerCase());
  let fmt=null;if(ix('exercise_title')>=0&&ix('start_time')>=0)fmt='hevy';else if(ix('Exercise Name')>=0&&ix('Set Order')>=0)fmt='strong';else if(ix('exercise')>=0&&ix('weight_lbs')>=0&&ix('warmup')>=0)fmt='chalk';
  if(!fmt)return {err:'Unrecognized format. Export a CSV from Hevy, Strong, or Chalk.'};
  const g={};const kgCol=fmt==='hevy'&&ix('weight_kg')>=0&&ix('weight_lbs')<0;
  const conv=w=>{w=num(w);if(w==null)return null;const u=fmt==='chalk'?'lb':fmt==='hevy'?(kgCol?'kg':'lb'):unit;return u==='kg'?Math.round(w*2.20462*2)/2:w};
  for(const r of rows.slice(1)){let when,title,dur=0,ex,wu=false,w,rp,rpe,note='';
    if(fmt==='hevy'){when=parseWhen(r[ix('start_time')]);const end=parseWhen(r[ix('end_time')]);if(when&&end&&end>when)dur=end-when;title=r[ix('title')];ex=r[ix('exercise_title')];wu=String(r[ix('set_type')]).toLowerCase()==='warmup';w=r[kgCol?ix('weight_kg'):ix('weight_lbs')];rp=r[ix('reps')];rpe=r[ix('rpe')];note=r[ix('exercise_notes')]||''}
    else if(fmt==='strong'){when=parseWhen(r[ix('Date')]);title=r[ix('Workout Name')];dur=parseDur(r[ix('Duration')]);ex=r[ix('Exercise Name')];const so=String(r[ix('Set Order')]||'').trim();if(!/^\d+$/.test(so)){if(/^w/i.test(so))wu=true;else continue}w=r[ix('Weight')];rp=r[ix('Reps')];rpe=ix('RPE')>=0?r[ix('RPE')]:'';note=r[ix('Notes')]||''}
    else{const tm=ix('time')>=0?String(r[ix('time')]||'').trim():'';when=parseWhen(r[ix('date')]+(/^\d{1,2}:\d{2}$/.test(tm)?' '+tm:''));title=r[ix('workout')];ex=r[ix('exercise')];wu=String(r[ix('warmup')]).toLowerCase()==='yes';w=r[ix('weight_lbs')];rp=r[ix('reps')];rpe=r[ix('rpe')];note=r[ix('exercise_note')]||''}

  out.sort((a,b)=>a.date-b.date);return {fmt,workouts:out.slice(-2000),dup,sets:out.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.length,0),0)}}

    const ow=num(md?md.lifts[L.k][0].w:null)||num(p.attempts[L.k][0]);

    case 'viewWk':{const w=S.workouts.find(x=>x.id===b.dataset.id);if(w){workoutDetail(w,isCoach());if(!isCoach()){const seen=lsGet('chalk-seen',{});seen[w.id]=Date.now();lsSet('chalk-seen',seen)}}break}
    case 'viewOther':{const w=lifterCache.find(x=>x.id===b.dataset.id);if(w)workoutDetail(w,true,S.lifterOpen);break}
    case 'delWk':{const id=b.dataset.id;if(!(await ask('Delete workout?','It will be removed from your history for good.','Delete',true)))break;const list=S.workouts.filter(x=>x.id!==id);await deleteWorkoutDoc(id);saveProfile(summarize(list));toast('Workout deleted');break}
    case 'viewEx':modalExercise(b.dataset.name);break;
    case 'viewLifter':if(!S.demo&&!isCoach()&&b.dataset.id!==S.uid)break;modalLifter(b.dataset.id);break;
    case 'toggleVid':{const w=S.workouts.find(x=>x.id===b.dataset.id);if(!w)break;const c=clone(w);const e=c.exercises[+b.dataset.i];if(!e)break;e.video=!e.video;
      const list=S.workouts.map(x=>x.id===c.id?c:x);if(S.mode==='cloud'){S.workouts=list;render()}await saveWorkoutDoc(c);saveProfile(summarize(list));break}
    case 'suggestAtt':{const at=clone(S.profile.attempts);let any=false;for(const L of LIFTS){const m=currentMax(L.k);if(!m)continue;any=true;at[L.k]=[.91,.96,1].map(p=>kgToLb(kgLoad(m*p)))}
      if(!any){toast('Add a starting max or log a comp lift first');break}await saveProfile({attempts:at});render();toast('Attempts filled in');break}
    case 'setRole':{const v=b.dataset.v==='coach'?'coach':'lifter';if(v===S.profile.role)break;if(v==='coach'&&S.profile.teamId&&!isAdmin()){await saveProfile({role:'coach'});toast('Coach access requested. A team admin needs to approve it.');render();break}
      if(v==='coach'&&!(await ask('Switch to coach?','Coach accounts can\'t log workouts. Your existing log stays saved.','Switch')))break;
      await saveProfile({role:v});S.tab=v==='coach'?'team':'home';render();break}
    case 'copyCode':{const c=S.team&&S.team.code;if(!c)break;try{await navigator.clipboard.writeText(c);toast('Join code copied')}catch(err){toast('Code: '+c)}break}
    case 'teamJoin':modalJoin();break;
    case 'teamCreate':modalCreate();break;
    case 'doJoin':{b.disabled=true;const ok=await joinByCode($('#jcode').value,$('#jErr'));b.disabled=false;if(ok){closeModal();toast('Joined the team');render()}break}
    case 'doCreate':{b.disabled=true;const ok=await createTeam($('#tname').value,$('#tErr'));b.disabled=false;if(ok){closeModal();toast('Team created');render()}break}
    case 'renameTeam':modalRename();break;
    case 'doRename':{const n=cleanStr($('#tname').value,LIM.team);if(n.length<2){$('#tErr').textContent='Name must be 2+ characters.';break}await queue(()=>S.db.doc('teams/'+S.uid).update({name:n}));closeModal();toast('Team renamed');break}
    case 'regenCode':{if(!(await ask('Make a new join code?','The current code will stop working. People already on the team stay.','New code')))break;
      let code=null;for(let i=0;i<6&&!code;i++){const c=genCode();try{if(!(await findTeam(c)))code=c}catch(err){}}
      if(!code){toast('Could not make a new code. Try again.');break}await queue(()=>S.db.doc('teams/'+S.uid).update({code}));toast('New code: '+code);break}
    case 'leaveTeam':if(await ask('Leave team?','You can rejoin later with the join code.','Leave',true)){await saveProfile({teamId:null});subscribeTeam();render();toast('You left the team')}break;
  }
});

document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.exq){S.exQ=t.value.slice(0,60);const box=$('#exRes');if(box)box.innerHTML=exResults(S.exQ);return}
  if(t.dataset.note!=null&&S.active){const ex=S.active.exercises[+t.dataset.note];if(ex){ex.note=t.value.slice(0,LIM.note);persistSoon()}return}
  if(t.dataset.wnote&&S.active){S.active.note=t.value.slice(0,LIM.wnote);persistSoon();return}
  if(t.id==='plW'){drawPlates();return}if(t.id==='rpeMax'){drawRpe();return}if(t.id==='wuW'){drawWarm();return}
  if(t.type==='date'){const ph=t.parentNode&&t.parentNode.querySelector('.date-ph');if(ph)ph.style.display=t.value?'none':''}
  if(t.dataset.f&&S.active){const ei=+t.dataset.e,si=+t.dataset.s;const ex=S.active.exercises[ei];if(!ex||!ex.sets[si])return;
    let v=t.value.slice(0,8);if(t.value!==v)t.value=v;ex.sets[si][t.dataset.f]=v;t.classList.toggle('bad',setBad(t.dataset.f,v));
    const live=exE1({sets:ex.sets});const c=$('#ex1-'+ei);if(c)c.textContent=live?`, e1RM ${live}`:'';persistSoon();return}
  if(t.dataset.s&&S.setup){const k=t.dataset.s;if(k==='code'){const v=normCode(t.value);if(t.value!==v)t.value=v;S.setup.code=v}else if(k.startsWith('max:'))S.setup.maxes[k.slice(4)]=t.value;else S.setup[k]=t.value}
  if(t.id==='jcode'){const v=normCode(t.value);if(t.value!==v)t.value=v}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.ww&&S.ww){S.ww[t.dataset.ww]=parseFloat(t.value);drawWW();return}
  if(t.dataset.tm==='nf'&&TM){syncTM();modalTM();return}
  if(t.dataset.pbtpl!=null&&PB){const tp=progTemplate(t.value);PB=Object.assign({id:null,start:PB.start||''},clone(tp));if(!t.value)PB.name='';modalPB();return}
  if(t.dataset.pb==='weeks'&&PB){syncPB();modalPB();return}
  if(t.dataset.pb&&PB&&/n$/.test(t.dataset.pb)){syncPB();const m=t.dataset.pb.match(/^d(\d+)e(\d+)n$/);if(m&&compKey(t.value))modalPB();return}
  if(t.dataset.mp){const k=t.dataset.mp;const mp=Object.assign({},S.profile.meetPlan);if(k==='wi'||k==='st'){if(t.value&&!/^\d{2}:\d{2}$/.test(t.value))return;mp[k]=t.value}else{const lim={fl:[1,20],nf:[1,20],fs:[1,40],br:[0,90]}[k];const v=parseInt(t.value);if(!(v>=lim[0]&&v<=lim[1])){t.classList.add('bad');toast(`Enter ${lim[0]}–${lim[1]}`);return}mp[k]=v}
    t.classList.remove('bad');await saveProfile({meetPlan:mp});setTimeout(render,60);return}
  if(t.id==='impFile'||t.id==='impUnit'){impRead();return}
  if(t.dataset.rtmain!=null&&editRt){syncRt();const x=editRt.r.exercises[+t.dataset.rtmain];x.main=t.value;x.sec=(x.sec||secOf(x.name)).filter(m=>m!==t.value);drawRoutine();return}
  if(t.id==='nxName'){const n=t.value;if(!n)return;const main=muscleOf(n);const ms=$('#nxMus');if(ms&&main!=='Other')ms.value=main;S.nxSec=secOf(n);const box=$('#nxSec');if(box)box.innerHTML=secChips('nx',S.nxSec,main);return}
  if(t.id==='nxMus'){S.nxSec=(S.nxSec||[]).filter(m=>m!==t.value);const box=$('#nxSec');if(box)box.innerHTML=secChips('nx',S.nxSec,t.value);return}
  if(t.dataset.md&&S.meetDay){const[k,i]=t.dataset.md.split(':');const r=vWeight(t.value);if(!r.ok){t.classList.add('bad');toast('Attempts must be 0–2000 lbs');return}S.meetDay.lifts[k][+i].w=r.v??'';saveMeetLocal();setTimeout(render,60);return}
  if(t.dataset.mbw&&S.meetDay){const v=num(t.value);if(t.value&&!(v>=50&&v<=700)){t.classList.add('bad');toast('Bodyweight must be 50–700 lbs');return}S.meetDay.bw=v??'';saveMeetLocal();setTimeout(render,60);return}
  if(t.dataset.mfor){const m=t.value;if(!MUSCLES.includes(m)&&m!=='Other')return;const mm=Object.assign({},S.profile.muscleMap);if(m==='Other')delete mm[t.dataset.mfor];else mm[t.dataset.mfor]=m;await saveProfile({muscleMap:mm});toast('Muscle updated');setTimeout(render,60);{const box=$('#exSec');const nm=t.closest('.sheet')&&sheet.querySelector('h2')?sheet.querySelector('h2').textContent:null;if(box&&nm)box.innerHTML=secChips('ex:'+nm,secOf(nm),muscleOf(nm))}return}
  if(t.dataset.rfor){const v=parseInt(t.value);if(!(v>=30&&v<=600))return;await saveProfile({restByEx:Object.assign({},S.profile.restByEx,{[t.dataset.rfor]:v})});toast('Rest time updated');return}
  if(t.dataset.vid!=null&&S.active){S.active.exercises[+t.dataset.vid].video=t.checked;persistDraft();return}
  if(t.dataset.body){const b=lsGet('chalk-body',{})||{};const k=t.dataset.body;let v=t.value;
    if(k==='act'){if(!ACT.some(a=>a[0]===v))return}else{v=v===''?'':num(v);const lim={ft:[3,8],inch:[0,11.9],age:[10,100],days:[0,7]}[k];if(v!==''&&(v==null||v<lim[0]||v>lim[1])){t.classList.add('bad');toast('Check that value');return}}
    t.classList.remove('bad');b[k]=v;lsSet('chalk-body',b);setTimeout(render,60);return}
  if(t.dataset.p==='weightClass'){const v=t.value;if(v&&![...WC.M,...WC.F].includes(v))return;await saveProfile({weightClass:v});setTimeout(render,60);return}
  if(t.dataset.p){const k=t.dataset.p;let v=t.value;
    if(k==='meetDate'||k==='blockStart'){if(!vDate(v)){t.classList.add('bad');toast('Pick a date between 2020 and 2035');return}}
    else v=cleanStr(v,k==='displayName'?LIM.name:LIM.meet);
    if(k==='displayName'&&v.length<1){t.classList.add('bad');toast('Display name can\'t be empty');return}
    t.classList.remove('bad');await saveProfile({[k]:v});setTimeout(render,60);return}
  if(t.dataset.max){const r=vWeight(t.value);if(!r.ok){t.classList.add('bad');toast('Max must be 0–2000 lbs');return}const m=Object.assign({},S.profile.maxes,{[t.dataset.max]:r.v});await saveProfile({maxes:m});setTimeout(render,60);return}
  if(t.dataset.att){const r=vWeight(t.value);if(!r.ok){t.classList.add('bad');toast('Attempts must be 0–2000 lbs');return}const[k,i]=t.dataset.att.split(':');const at=clone(S.profile.attempts);at[k][+i]=r.v;await saveProfile({attempts:at});setTimeout(render,60);return}
});

async function setupNext(){const s=S.setup;const err=()=>$('#sErr');const steps=s.role==='coach'||['bb','gen'].includes(s.focus)?2:3;
  if(s.step===0){s.displayName=cleanStr(s.displayName,LIM.name);if(!s.displayName){err().textContent='Enter a display name.';return}s.step=1;render();return}
  if(s.step===1&&S.obPreview&&s.teamMode!=='skip'){toast('Preview: team join and create are skipped')}
  else if(s.step===1&&S.mode==='cloud'&&s.teamMode!=='skip'){s.busy=true;render();
    const ok=s.teamMode==='join'?await joinByCode(s.code,{set textContent(v){S.setupErr=v}}):await createTeam(s.teamName,{set textContent(v){S.setupErr=v}});
    s.busy=false;render();if(!ok){const el=err();if(el)el.textContent=S.setupErr||'Something went wrong.';return}}
  if(s.step===1&&steps===3){s.step=2;render();return}
  if(s.step===2){for(const k of ['meetDate','blockStart'])if(!vDate(s[k])){err().textContent='Pick dates between 2020 and 2035.';return}
    const maxes={};for(const L of LIFTS){const r=vWeight(s.maxes[L.k]);if(!r.ok){err().textContent=`${L.n} max must be 0–2000 lbs.`;return}maxes[L.k]=r.v}
    s.maxes=maxes;}
  s.busy=true;render();
  const patch={displayName:s.displayName,role:s.role,setupDone:true,source:s.source||'',focus:s.focus||''};
  if(s.role!=='coach')Object.assign(patch,{meetName:cleanStr(s.meetName,LIM.meet)||'Meet',meetDate:s.meetDate,blockStart:s.blockStart,maxes:s.maxes});
  if(S.obPreview){S.obPreview=false;S.setup=null;S.screen='app';S.tab='settings';render();toast('Preview finished. Nothing was saved.');return}
  const saved=await saveProfile(patch);
  if(saved===false){s.busy=false;if(S.readOnly){S.setup=null;S.screen='noaccess';render();return}render();const el=err();if(el)el.textContent='Couldn\'t save your profile. Check your connection and tap again.';return}
  S.setup=null;S.screen='app';S.tab=s.role==='coach'?'team':'home';render();toast('You\'re all set');
}

/* ================= Long press ================= */
(function(){let t=null,sx=0,sy=0;const cancel=()=>{clearTimeout(t);t=null};
  wk.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-lp]');if(!h||e.target.closest('button,input,textarea'))return;sx=e.clientX;sy=e.clientY;cancel();t=setTimeout(()=>{t=null;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}modalQuick(+h.dataset.lp)},450)});
  wk.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8))cancel()});['pointerup','pointercancel','pointerleave'].forEach(ev=>wk.addEventListener(ev,cancel));
  wk.addEventListener('contextmenu',e=>{if(e.target.closest('[data-lp]'))e.preventDefault()})})();
/* ================= Public summary (what teammates can see) ================= */
function actual1RM(list,k){let b=null;for(const w of list)for(const ex of w.exercises)if(ex.comp===k)for(const s of ex.sets){const wt=Number(s.w);if(s.wu||Number(s.r)!==1||!(wt>0))continue;if(!b||wt>b.v)b={v:wt,date:w.date}}return b}
let pubLast='',pubTimer=null;
function schedulePublic(){clearTimeout(pubTimer);pubTimer=setTimeout(syncPublic,1500)}
function syncPublic(){if(S.mode!=='cloud'||S.demo||!S.db||!S.profileLoaded||!S.profileExists||!S.bothLoaded)return;const p=S.profile;if(!p)return;
  const prs={};for(const L of LIFTS){const b=actual1RM(S.workouts,L.k);if(b)prs[L.k]=b}
  const last=Math.max(num(p.lastWorkout)||0,...S.workouts.map(w=>w.date||0))||null;
  const doc={displayName:p.displayName||'',role:p.role==='coach'?'coach':'lifter',teamId:p.teamId||null,teamJoinAt:p.teamJoinAt||0,setupDone:!!p.setupDone,prs,lastWorkout:last,photo:(S.fbUser&&S.fbUser.photoURL)||''};
  const js=JSON.stringify(doc);if(js===pubLast)return;pubLast=js;doc.updatedAt=Date.now();
  S.db.doc('public/'+S.uid).set(doc).catch(e=>{console.warn('public',e&&e.code);pubLast='';setTimeout(schedulePublic,5000)})}
function activityCard(ms){if(!ms.length)return '';const t0=+today0(),w0=weekStart(Date.now());
  const today=ms.filter(m=>(m.lastWorkout||0)>=t0),week=ms.filter(m=>(m.lastWorkout||0)>=w0&&(m.lastWorkout||0)<t0);
  const names=a=>a.map(m=>`<span class="pill" style="font-size:13px" data-nm="${esc(m.id)}" data-dn="${esc(m.displayName)}">${esc(m.displayName||'Teammate')}</span>`).join('');
  return `<div class="sec-title"><h2>Who's training</h2></div><div class="card"><h3 style="margin:0 0 8px">Today</h3><div class="row wrap" style="gap:6px">${names(today)||'<span class="small muted">Nobody yet</span>'}</div>
  <h3 style="margin:14px 0 8px">Earlier this week</h3><div class="row wrap" style="gap:6px">${names(week)||'<span class="small muted">Nobody yet</span>'}</div></div>`}

/* ================= Sign in ================= */
function viewSignIn(){return `<div class="ob"><div class="ob-hero">
  <div class="stripe"><i></i><i></i><i></i></div><div class="brand">Chalk</div>
  <p style="font:800 30px/1.05 var(--fd);margin:0 0 10px;letter-spacing:.3px">Sign in to train with your team.</p>
  <p style="font-size:17px;max-width:34ch;color:#D6D1C7">Your log follows you to any device. Your coach sees your training. Teammates see your PRs.</p></div>
  <div class="card" style="margin-top:8px">
  <button class="btn primary block" style="min-height:52px" data-a="siGoogle">Continue with Google</button>
  <p class="xs muted" style="text-align:center;margin:14px 0">or use email</p>
  <input class="inp" id="siEmail" type="email" autocomplete="email" autocapitalize="off" placeholder="Email" style="width:100%;margin-bottom:8px">
  <input class="inp" id="siPass" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" style="width:100%">
  <p class="small" id="siErr" style="color:var(--danger);min-height:1.2em;margin:8px 0 0"></p>
  <div class="grid2" style="margin-top:8px"><button class="btn primary" data-a="siEmailIn">Sign in</button><button class="btn" data-a="siEmailUp">Create account</button></div>
  <button class="btn sm block" style="margin-top:8px" data-a="siReset">Forgot password</button></div></div>`}
function authMsg(e){const c=(e&&e.code)||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
  if(c==='auth/email-already-in-use')return 'That email already has an account. Tap Sign in.';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Email or password is wrong.';
  if(c==='auth/too-many-requests')return 'Too many tries. Wait a minute.';
  if(c==='auth/network-request-failed')return 'No connection. Try again.';
  if(c==='auth/unauthorized-domain')return 'This website isn\'t authorized in Firebase yet. Add it under Authentication > Settings.';
  return 'Couldn\'t sign in. Try again.'}
async function fbGoogle(){const err=$('#siErr');const p=new firebase.auth.GoogleAuthProvider();
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  try{if(standalone)await firebase.auth().signInWithRedirect(p);else await firebase.auth().signInWithPopup(p)}catch(e){if(err){err.style.color='';err.textContent=authMsg(e)}}}
async function fbEmail(a){const err=$('#siErr');if(!err)return;const em=(($('#siEmail')||{}).value||'').trim();const pw=($('#siPass')||{}).value||'';err.style.color='';err.textContent='';
  if(!/^\S+@\S+\.\S+$/.test(em)){err.textContent='Enter a valid email.';return}
  try{const au=firebase.auth();
    if(a==='siReset'){await au.sendPasswordResetEmail(em);err.style.color='var(--ok)';err.textContent='Reset link sent. Check your email.';return}
    if(pw.length<6){err.textContent='Password needs 6+ characters.';return}
    if(a==='siEmailUp')await au.createUserWithEmailAndPassword(em,pw);else await au.signInWithEmailAndPassword(em,pw)}
  catch(e){err.textContent=authMsg(e)}}
function fbConfigured(){const c=window.CHALK_FIREBASE;return !!(window.firebase&&c&&c.apiKey&&c.projectId&&!/YOUR_/.test(c.apiKey+c.projectId))}
function initialAvatar(name){const ch=(String(name||'?').trim()[0]||'?').toUpperCase().replace(/[<>&"']/g,'?');
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="32" fill="#262B33"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#F1F3F6" text-anchor="middle">${ch}</text></svg>`)}
function makeUser(u){return {id:async()=>u.uid,isOwner:async()=>false,can:async()=>true,
  profiles:async ids=>{const o={};for(const id of ids){const isMe=id===S.uid;const m=(S.allLifters||[]).find(x=>x.id===id);
    const name=isMe?((S.profile&&S.profile.displayName)||u.displayName||''):((m&&m.displayName)||'');const photo=isMe?(u.photoURL||''):((m&&m.photo)||'');
    o[id]={name,avatarUrl:photo||initialAvatar(name),isMe}}return o}}}

/* ================= Boot ================= */
function onErr(e){console.error(e);if(e&&e.code==='revoked')toast('Your access to this app changed')}
function afterProfile(){if(!S.profile.setupDone&&S.screen==='app'&&!S.setup)S.screen=S.readOnly?'noaccess':'welcome'}
function localMode(){S.mode='local';S.profile=sanitizeProfile(lsGet('chalk-profile',null));S.workouts=(lsGet('chalk-workouts',[])||[]).map(w=>sanitizeWorkout(w.id,w)).filter(Boolean);afterProfile();render()}
render();
(async()=>{
  if(!fbConfigured()){localMode();return}
  let db;try{if(!firebase.apps.length)firebase.initializeApp(window.CHALK_FIREBASE);db=firebase.firestore();
    try{db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
    try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}}catch(e){console.error(e);localMode();return}
  const u=await new Promise(res=>{let first=true;firebase.auth().onAuthStateChanged(x=>{if(first){first=false;res(x);return}
    if(!!x!==!!S.fbUser||(x&&S.fbUser&&x.uid!==S.fbUser.uid))location.reload()})});
  if(!u){S.mode='signin';S.screen='signin';render();return}
  S.fbUser=u;S.user=makeUser(u);S.uid=u.uid;S.isOwner=false;S.canWrite=true;S.screen='app';
  S.db=db;S.mode='cloud';S.profile=defaultProfile();let gotP=false,gotW=false,lastTeam;
  const ready=()=>{if(gotP&&gotW){S.bothLoaded=true;schedulePublic();render()}};

  profRef().onSnapshot(s=>{if(!s.exists&&s.metadata&&s.metadata.fromCache)return;S.profileExists=s.exists;S.profileLoaded=true;tgt().profile=sanitizeProfile(s.exists?s.data():null);if(S.demo){ready();return}if(!S.profileSeen){S.profileSeen=true;gotP=true;if(S.slowLoad){S.slowLoad=false;gotW=true}afterProfile()}
    if(S.profile.teamId!==lastTeam){lastTeam=S.profile.teamId;subscribeTeam();subscribeLifters();syncSocial()}ready()},onErr);
  wkCol().orderBy('date','desc').limit(1000).onSnapshot(q=>{tgt().workouts=expandDocs(q.docs);gotW=true;ready();if(q.docs.length>=800)setTimeout(()=>compactOld(q.docs),5000)},onErr);
  setTimeout(()=>{if(!gotP||!gotW){if(!gotP){gotP=true;S.slowLoad=true}gotW=true;render()}},7000);
})();
</script>
